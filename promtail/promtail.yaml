server:
  http_listen_address: 0.0.0.0
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs dos containers Docker (json-file em /var/lib/docker/containers)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_id"]
        regex: (.+)
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
    pipeline_stages:
      - docker: {}

  # Logs em texto no hospedeiro (montados em /var/log/host)
  - job_name: host_varlog
    static_configs:
      - targets:
          - localhost
        labels:
          job: host
          __path__: /var/log/host/**/*.log

  # Ubuntu/Debian: syslog sem sufixo .log
  - job_name: host_syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: host
          log_class: syslog
          __path__: /var/log/host/syslog
